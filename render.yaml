# Render Blueprint for one-click deploy.
#
# Free tier notes:
#   - Web service spins down after 15 minutes of inactivity (~30s cold start).
#   - Postgres is hosted externally on Neon (https://neon.tech) — free forever,
#     no 90-day auto-delete like Render's free Postgres tier had. Set
#     DATABASE_URL manually in the Render dashboard using the connection
#     string Neon provides (postgresql://user:pass@host/db?sslmode=require).
services:
  - type: web
    name: triagent
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT --timeout 60
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_DEBUG
        value: "0"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false   # set this manually in the Render dashboard
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SEED_DEMO_DATA
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        sync: false   # Neon connection string, set manually in the Render dashboard
      # ----- Email (password reset codes) -----
      # Set ONE backend in the Render dashboard. If none are set, codes are
      # printed to the service logs (sufficient for a demo).
      - key: SMTP_HOST
        sync: false   # e.g. smtp.gmail.com
      - key: SMTP_PORT
        sync: false   # e.g. 587
      - key: SMTP_USER
        sync: false   # e.g. you@gmail.com
      - key: SMTP_PASSWORD
        sync: false   # Gmail App Password (16 chars), NOT your account password
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
