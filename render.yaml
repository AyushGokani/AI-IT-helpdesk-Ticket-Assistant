# Render Blueprint for one-click deploy.
# Use the "Deploy to Render" button in the README, or push to a connected repo
# and Render will auto-detect this file.
#
# Free tier notes:
#   - Spins down after 15 minutes of inactivity (~30s cold start on next visit).
#   - File system is ephemeral: ticket data resets on every redeploy / restart.
#     For a portfolio demo this is fine — SEED_DEMO_DATA=1 re-populates the
#     queue with 8 example tickets on every cold boot.
#   - To make data permanent, upgrade to a paid plan and re-add a `disk:` block
#     mounted at /var/data, plus set DATA_DIR=/var/data.
services:
  - type: web
    name: triagent
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT --timeout 60
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_DEBUG
        value: "0"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false   # set this manually in the Render dashboard
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SEED_DEMO_DATA
        value: "1"
